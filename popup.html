<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ivelt Eretz Yisroel Time</title>
<style>
  :root {
    --bg: #fbfaf8;
    --ink: #1d1d1b;
    --muted: #77736b;
    --line: #e7e4de;
    --field: #ffffff;
    --chip: #f0eee9;
    --on: #1d1d1b;
    --on-ink: #fbfaf8;
    --ok: #3f7d4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1b1a; --ink: #ecebe8; --muted: #9a968e; --line: #2f2e2b;
      --field: #232321; --chip: #2a2927; --on: #ecebe8; --on-ink: #1b1b1a; --ok: #7fbf8e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1b1a; --ink: #ecebe8; --muted: #9a968e; --line: #2f2e2b;
    --field: #232321; --chip: #2a2927; --on: #ecebe8; --on-ink: #1b1b1a; --ok: #7fbf8e;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0 auto; width: 360px; max-width: 100%;
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 system-ui, "Segoe UI", Arial, sans-serif;
  }

  header {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 12px; border-bottom: 1px solid var(--line);
  }
  header img { width: 20px; height: 20px; }
  header b { font-size: 14px; font-weight: 600; }
  #saved { margin-inline-start: auto; color: var(--ok); font-size: 12px; opacity: 0; transition: opacity .3s; }
  #saved.show { opacity: 1; }
  #saved.error { color: #b3261e; }

  section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }

  .seg { display: flex; background: var(--chip); border-radius: 7px; padding: 2px; }
  .seg label { flex: 1; text-align: center; padding: 5px 4px; border-radius: 5px; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--on); color: var(--on-ink); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--muted); outline-offset: 1px; }

  .note { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .note[hidden] { display: none; }
  #format-section.off .seg, #format-section.off .note { opacity: .45; pointer-events: none; }
  .note bdi { color: var(--ink); }

  .link { background: none; border: 0; padding: 0; margin-top: 10px; font: inherit; font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; }

  footer { padding: 10px 16px 14px; color: var(--muted); font-size: 11px; }
  footer a { color: inherit; }
</style>
</head>
<body>
  <header>
    <img src="icons/32.png" alt="">
    <b>ivelt Eretz Yisroel Time</b>
    <span id="saved">Saved</span>
  </header>

  <section>
    <h2>Show times in</h2>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="targetTz" value="Asia/Jerusalem">Eretz Yisroel</label>
      <label><input type="radio" name="targetTz" value="Europe/London">London</label>
      <label><input type="radio" name="targetTz" value="original">Forum default</label>
    </div>
    <p class="note" id="original-note" hidden>Dates show as they are on the forum, in New York time. Handy when you're in New York for a while.</p>
  </section>

  <section id="format-section">
    <h2>Date format</h2>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="format" value="weekday">Weekday</label>
      <label><input type="radio" name="format" value="date">Date</label>
      <label><input type="radio" name="format" value="timeFirst">Time first</label>
      <label><input type="radio" name="format" value="ampm">12-hour</label>
    </div>
    <p class="note">Right now: <bdi id="preview"></bdi></p>
    <button type="button" class="link" id="reset">Back to defaults</button>
  </section>

  <footer>
    Settings sync through your Google account. ·
    <a href="https://github.com/the-curious-2025/ivelt-eretz-yisroel-time" target="_blank">GitHub</a>
  </footer>

<script src="popup.js"></script>
</body>
</html>
